<!DOCTYPE html>
<html lang="es">
<head>
    <title>Confirmar eliminación del calendario</title>
</head>
<body>
    <h2>Confirmar eliminación del calendario</h2>
    <p>¿Seguro que quieres eliminar «{{ calendar_view.nombre }}»?</p>
    <form method="post">
        {% csrf_token %}
        <button type="submit">Sí, eliminar</button>
    </form>
    <p><a href="{% url 'calendar_view_panel' %}">Cancelar</a></p>
</body>
</html>
