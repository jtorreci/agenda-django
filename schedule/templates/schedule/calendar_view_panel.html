<!DOCTYPE html>
<html lang="es">
<head>
    <title>Panel de calendarios</title>
</head>
<body>
    <h2>Tus calendarios</h2>
    <p><a href="{% url 'create_calendar_view' %}">Crear nuevo calendario</a></p>
    <ul>
        {% for view in calendar_views %}
            <li>
                {{ view.nombre }} - <a href="{% url 'delete_calendar_view' view.pk %}">Eliminar</a>
                (URL iCal: <a href="{% url 'ical_feed' view.token %}">{% url 'ical_feed' view.token %}</a>)
            </li>
        {% empty %}
            <li>No se han encontrado calendarios.</li>
        {% endfor %}
    </ul>
    <p><a href="{% url 'student_dashboard' %}">Volver al panel del estudiante</a></p>
</body>
</html>
