{% extends 'base.html' %}

{% block title %}Confirmar reactivación{% endblock %}

{% block content %}
<div class="container mt-4">
    <h2>Confirmar reactivación</h2>
    <p>¿Seguro que quieres reactivar la actividad <strong>{{ activity.nombre }}</strong>?</p>
    
    <form method="post">
        {% csrf_token %}
        <button type="submit" class="btn btn-success">Reactivar</button>
        <a href="{% url 'activity_logs' %}" class="btn btn-secondary">Cancelar</a>
    </form>
</div>
{% endblock %}
