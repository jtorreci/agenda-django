<!DOCTYPE html>
<html lang="es">
<head>
    <title>Confirmar eliminación</title>
</head>
<body>
    <h2>Confirmar eliminación</h2>
    <p>¿Seguro que quieres eliminar «{{ activity.nombre }}»?</p>
    <form method="post">
        {% csrf_token %}
        <button type="submit">Sí, eliminar</button>
    </form>
    <p><a href="{% url 'teacher_dashboard' %}">Cancelar</a></p>
</body>
</html>
