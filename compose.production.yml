services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    env_file: .env.garnocex
    environment:
      POSTGRES_DB: ${POSTGRES_DB:?Set POSTGRES_DB in .env.garnocex}
      POSTGRES_USER: ${POSTGRES_USER:?Set POSTGRES_USER in .env.garnocex}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env.garnocex}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 10s
      timeout: 5s
      retries: 5

  web:
    build: .
    restart: unless-stopped
    env_file: .env.garnocex
    environment:
      DJANGO_SETTINGS_MODULE: agenda_academica.settings_production
      DJANGO_DEBUG: "False"
      DATABASE_URL: postgresql://${POSTGRES_USER:?Set POSTGRES_USER}:${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB:?Set POSTGRES_DB}
    command: >-
      sh -c "python manage.py migrate --noinput && python manage.py collectstatic --noinput &&
      gunicorn agenda_academica.wsgi:application --bind 0.0.0.0:8000 --workers 3
      --access-logfile - --error-logfile -"
    depends_on:
      db:
        condition: service_healthy
    ports:
      - "127.0.0.1:${APP_PORT:-8000}:8000"
    volumes:
      - media_data:/app/media

volumes:
  postgres_data:
  media_data:
